html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
svg{display:block}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
#app>*{min-width:0}

/* ---------- top bar */
.top{display:flex;align-items:center;gap:clamp(10px,1.6vw,28px);padding:clamp(6px,1vh,12px) max(16px,2vw);background:var(--green-d);color:#fff}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--display);font-weight:800;font-size:clamp(14px,2.1vh,22px);white-space:nowrap}
.brand small{font-size:clamp(11px,1.5vh,15px);color:#CFE6DF;white-space:nowrap}
.phases{flex:1;display:flex;gap:4px;min-width:0}
.ph{min-width:0;border-radius:8px;padding:clamp(4px,.6vh,8px) clamp(6px,.6vw,10px);color:#fff;font-weight:700;font-size:clamp(11px,1.45vh,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.5;transition:opacity .3s}
.ph i{font-style:normal;font-weight:500;opacity:.85}
.ph.on{opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.75)}
.code{flex:none;max-width:18vw;overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,1.5vh,15px);color:#CFE6DF;text-align:right;white-space:nowrap}
.code b{display:block;color:var(--gold);font-size:clamp(12px,1.7vh,17px)}

/* ---------- stage */
.stage{position:relative;min-height:0;display:grid;grid-template-rows:auto 1fr;gap:clamp(8px,1.6vh,22px);padding:clamp(10px,2vh,26px) max(16px,3vw) clamp(10px,2vh,24px)}
.stage.dark{background:var(--night);color:#fff}
.head{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);min-width:0}
.say-btn{flex:none;width:clamp(48px,9vh,100px);height:clamp(48px,9vh,100px);border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 4px 0 #C99400}
.say-btn svg{width:52%;height:52%}
.say-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C99400}
.htext{min-width:0;flex:1}
.htext .kick{font-weight:700;color:var(--gold-d);font-size:clamp(12px,1.8vh,18px);letter-spacing:.08em;text-transform:uppercase}
.stage.dark .htext .kick{color:var(--gold)}
.htext h1{margin:.1em 0 0;font-family:var(--display);font-weight:800;color:var(--green-d);font-size:clamp(24px,6.2vh,78px);line-height:1.06;text-wrap:balance}
.stage.dark .htext h1{color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;max-width:46%}
.play{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(10px,2vh,26px);overflow-y:auto;overflow-x:hidden;padding:12px 4px 4px}
.play>:first-child{margin-top:auto}
body.mid .play>:last-child{margin-bottom:auto}

/* teacher chips & toggles */
.chip{display:inline-flex;align-items:center;gap:6px;height:clamp(36px,5.2vh,54px);padding:0 clamp(10px,1vw,18px);border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:clamp(12px,1.7vh,17px);color:var(--green-d)}
.chip svg{width:1.2em;height:1.2em}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.stage.dark .chip{background:#22393F;border-color:#36535A;color:#fff}
.seg{display:inline-flex;border-radius:999px;background:#fff;border:2px solid var(--line);overflow:hidden}
.seg button{height:clamp(34px,4.9vh,50px);padding:0 clamp(10px,1vw,16px);font-weight:700;font-size:clamp(12px,1.7vh,17px);color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
.seg button.g-bintang.on{background:var(--star)} .seg button.g-bulan.on{background:var(--indigo)} .seg button.g-matahari.on{background:var(--coral)}

/* ---------- items (jagung / ikan) */
.cset{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,18px)}
.crow{display:flex;gap:clamp(6px,1.2vw,22px);justify-content:center;flex-wrap:wrap}
.item{position:relative;display:grid;place-items:center;border-radius:var(--r);padding:clamp(4px,.8vh,10px);background:var(--paper);box-shadow:0 3px 0 var(--line);transition:transform .15s,background .2s}
.item .ill{height:var(--ih,24vh);width:auto}
.item.fish .ill{height:calc(var(--ih,24vh)*.5);width:auto;margin:calc(var(--ih,24vh)*.25) 0}
.item.on{background:var(--gold-l);box-shadow:0 3px 0 #E5C463}
.item .badge{position:absolute;top:-10px;right:-10px;min-width:clamp(30px,5vh,52px);height:clamp(30px,5vh,52px);border-radius:999px;background:var(--green);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(16px,3vh,30px);display:grid;place-items:center;transform:scale(0);transition:transform .2s}
.item.on .badge{transform:scale(1)}
.item.glow{background:var(--gold-l);transform:translateY(-8px)}
.item.wiggle{animation:wig .4s}
.item:active{transform:scale(.96)}
.item.static{cursor:default}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* number cards & dots */
.choices{display:flex;gap:clamp(10px,2vw,36px);justify-content:center;flex-wrap:wrap}
.ncard{min-width:clamp(96px,17vh,210px);padding:clamp(8px,1.2vh,16px) clamp(10px,1.4vw,22px);border-radius:calc(var(--r)*1.4);background:#fff;border:4px solid var(--line);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.ncard .num{font-family:var(--display);font-weight:800;font-size:clamp(56px,13vh,170px);line-height:1;color:var(--green-d)}
.ncard.right{background:var(--ok-l);border-color:var(--ok);box-shadow:0 6px 0 #9FD4B2}
.ncard.shake{animation:shake .45s}
.ncard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.dots{display:grid;grid-template-columns:repeat(5,auto);gap:clamp(3px,.6vh,8px);justify-content:center}
.dots i{width:clamp(10px,1.9vh,22px);height:clamp(10px,1.9vh,22px);border-radius:50%;background:var(--coral)}
.dots.big i{width:clamp(18px,4vh,46px);height:clamp(18px,4vh,46px)}
.dots i.off{background:transparent;box-shadow:inset 0 0 0 3px #E2C9B8}

/* big buttons */
.big{display:inline-flex;align-items:center;gap:12px;height:clamp(54px,9vh,96px);padding:0 clamp(18px,2.4vw,40px);border-radius:999px;background:var(--green);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(17px,3vh,32px);box-shadow:0 5px 0 var(--green-d)}
.big.gold{background:var(--gold);color:var(--green-d);box-shadow:0 5px 0 #C99400}
.big svg{width:1.1em;height:1.1em}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.yt{display:flex;gap:clamp(16px,3vw,60px)}
.yt button{width:clamp(130px,30vh,340px);height:clamp(110px,24vh,270px);border-radius:calc(var(--r)*1.6);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(26px,6vh,68px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.yt .ya{background:var(--ok);box-shadow:0 7px 0 #1E6E3C}
.yt .tidak{background:var(--no);box-shadow:0 7px 0 #9C2B2B}
.yt svg{width:34%;height:auto}
.yt button.sel{outline:6px solid var(--gold);outline-offset:4px}

/* panels */
.row{display:flex;gap:clamp(12px,2.4vw,44px);align-items:flex-end;justify-content:center;flex-wrap:wrap;width:100%}
.panel{background:var(--paper);border-radius:calc(var(--r)*1.5);padding:clamp(10px,1.8vh,24px) clamp(12px,1.6vw,28px);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,14px);min-width:0}
.plabel{font-weight:800;font-size:clamp(12px,1.8vh,18px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.arrow{font-family:var(--display);font-weight:800;color:var(--gold);font-size:clamp(30px,7vh,80px);align-self:center}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(90px,26vh,300px);line-height:.95;color:var(--green)}
.bignum.q{color:#D9CFB5}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* schedule */
.sched{display:flex;gap:clamp(10px,1.6vw,30px);justify-content:center;width:100%}
.scard{position:relative;flex:1 1 0;min-width:0;max-width:380px;padding:clamp(10px,1.8vh,22px) 10px clamp(12px,2vh,22px);border-radius:calc(var(--r)*1.5);background:#fff;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1vh,12px);transition:background .25s}
.scard .snum{position:absolute;left:12px;top:10px;font-family:var(--display);font-weight:800;color:var(--muted);font-size:clamp(14px,2.4vh,26px)}
.scard .sic{height:clamp(70px,25vh,270px);display:grid;place-items:center}
.scard .sic svg{height:100%;width:auto}
.scard .slab{font-family:var(--display);font-weight:800;font-size:clamp(15px,3.2vh,36px);text-align:center;color:var(--green-d);line-height:1.15;text-wrap:balance}
.scard .tick{position:absolute;right:-10px;top:-10px;width:clamp(36px,6.5vh,70px);height:clamp(36px,6.5vh,70px);border-radius:50%;background:var(--ok);display:grid;place-items:center;transform:scale(0);transition:transform .25s}
.scard .tick svg{width:60%;height:60%}
.scard.done{background:var(--ok-l)}
.scard.done .tick{transform:scale(1)}
.scard.done .sic{opacity:.55}

/* feelings */
.feels{display:flex;gap:clamp(14px,3vw,60px);justify-content:center;flex-wrap:wrap}
.feel{display:flex;flex-direction:column;align-items:center;gap:8px;padding:clamp(8px,1.4vh,18px);border-radius:calc(var(--r)*1.6);background:#fff;box-shadow:0 6px 0 var(--line)}
.feel svg{width:clamp(110px,32vh,340px);height:auto}
.feel span{font-family:var(--display);font-weight:800;font-size:clamp(18px,4vh,44px);color:var(--green-d)}
.feel.sel{background:var(--gold-l);outline:6px solid var(--gold);outline-offset:3px}

/* bentor */
.bentor-wrap{position:relative;width:min(78vw,112vh);max-width:100%}
.bentor-wrap svg{width:100%;height:auto;overflow:visible}
.bentor-wrap.go svg{animation:drive 2.6s ease-in forwards}
@keyframes drive{0%{transform:translateX(0)}15%{transform:translateX(-2%)}100%{transform:translateX(-140%)}}
.bcorn{cursor:pointer}
.bcorn.on .bcorn-bg{fill:#FFE9A6}

/* dark slide (Dika) */
.giant{display:flex;gap:clamp(18px,5vw,90px);justify-content:center;align-items:flex-end}
.gitem{position:relative;padding:clamp(10px,2vh,24px);border-radius:28px;background:#1E3439;transition:transform .25s, background .3s, box-shadow .3s}
.gitem svg{height:min(46vh,40vw);width:auto}
.gitem.fishy svg{height:auto;width:min(26vw,40vh)}
.gitem.lit{background:#3B5A2E;box-shadow:0 0 0 6px var(--gold),0 0 60px 10px rgba(244,180,0,.55);transform:translateY(-12px) scale(1.04)}
.gitem .gnum{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);font-family:var(--display);font-weight:800;font-size:clamp(40px,9vh,100px);color:var(--gold);opacity:0}
.gitem.lit .gnum{opacity:1}
.pick2{display:flex;gap:clamp(20px,5vw,90px)}
.pick2 button{background:#fff;border-radius:28px;padding:clamp(14px,3vh,34px);box-shadow:0 8px 0 #0C1B1F;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--green-d);font-family:var(--display);font-weight:800;font-size:clamp(22px,4.4vh,48px)}
.pick2 button svg{height:min(30vh,28vw);width:auto}
.pick2 button.fishbtn svg{height:auto;width:min(30vh,28vw)}
.stage:not(.dark) .pick2 button{box-shadow:0 8px 0 var(--line)}

/* number line */
.nline{display:flex;gap:clamp(6px,.9vw,16px);flex-wrap:wrap;justify-content:center}
.nbtn{width:clamp(56px,12vh,150px);height:clamp(56px,12vh,150px);border-radius:var(--r);background:#fff;box-shadow:0 5px 0 var(--line);font-family:var(--display);font-weight:800;font-size:clamp(26px,7.4vh,84px);color:var(--green-d)}
.nbtn.on{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d)}

/* wagons */
.train{display:flex;align-items:flex-end;gap:clamp(4px,.5vw,10px);flex-wrap:wrap;justify-content:center}
.wagon{position:relative;width:clamp(44px,7.2vw,170px);height:clamp(64px,16vh,180px);border-radius:12px 12px 6px 6px;background:var(--indigo);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(28px,8vh,92px);color:#fff;margin-bottom:clamp(10px,1.8vh,20px)}
.wagon:after,.wagon:before{content:'';position:absolute;bottom:calc(-1 * clamp(10px,1.8vh,20px));width:clamp(16px,2.6vh,28px);height:clamp(16px,2.6vh,28px);border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 5px #9AA5A6}
.wagon:before{left:14%} .wagon:after{right:14%}
.wagon.blank{background:#fff;color:var(--muted);box-shadow:inset 0 0 0 4px var(--indigo);cursor:pointer}
.wagon.blank.act{box-shadow:inset 0 0 0 6px var(--gold);background:var(--gold-l)}
.wagon.filled{background:var(--gold);color:var(--green-d)}
.train .engine{width:clamp(110px,16vw,300px);margin-left:6px}
.train.go{animation:drive 3s ease-in forwards}

/* tracing */
.tracewrap{display:flex;gap:clamp(12px,2vw,40px);justify-content:center;align-items:flex-end;width:100%}
.tpad{position:relative;background:#fff;border-radius:calc(var(--r)*1.4);box-shadow:0 5px 0 var(--line);width:min(40vw,49vh);aspect-ratio:1/1.05;max-width:100%}
.tpad .guide{position:absolute;inset:15% 8% 5%}
.tpad .guide svg{width:100%;height:100%}
.tpad canvas{position:absolute;inset:0;width:100%;height:100%}
.tpad canvas{touch-action:none}
.tpad .tname{position:absolute;left:14px;top:10px;font-weight:800;color:var(--muted);font-size:clamp(12px,1.8vh,18px);letter-spacing:.08em;text-transform:uppercase;z-index:2}
.tpad .tbtns{position:absolute;right:10px;top:10px;display:flex;gap:8px;z-index:2}
.cue{font-family:var(--display);font-weight:800;color:var(--coral);font-size:clamp(16px,2.8vh,30px);text-align:center}

/* steps */
.steps{display:flex;gap:clamp(8px,1.4vw,24px);justify-content:center;flex-wrap:wrap}
.step{width:clamp(130px,19vw,330px);border-radius:calc(var(--r)*1.4);background:#fff;box-shadow:0 5px 0 var(--line);padding:clamp(8px,1.6vh,18px);display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.45;transition:opacity .3s,transform .3s,background .3s}
.step .sn{font-family:var(--display);font-weight:800;color:var(--gold-d);font-size:clamp(16px,2.6vh,28px)}
.step .si{height:clamp(54px,15vh,170px);display:grid;place-items:center;font-size:clamp(40px,11vh,130px)}
.step .si svg{height:100%;width:auto}
.step .st{font-family:var(--display);font-weight:800;color:var(--green-d);font-size:clamp(14px,3vh,34px);text-align:center;line-height:1.15}
.step.on{opacity:1;background:var(--gold-l);transform:translateY(-8px);outline:5px solid var(--gold)}
.step.past{opacity:.85}

/* shopping card */
.kartu{background:#fff;border-radius:calc(var(--r)*1.6);border:5px dashed var(--coral);padding:clamp(10px,1.8vh,22px) clamp(16px,2vw,36px);display:flex;flex-direction:column;align-items:center;gap:8px;min-width:clamp(180px,22vw,360px)}
.kartu .kt{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);font-size:clamp(12px,1.8vh,18px)}
.kartu .kn{font-family:var(--display);font-weight:800;font-size:clamp(80px,24vh,270px);line-height:.95;color:var(--green-d)}
.kartu .kitem{display:flex;gap:6px;align-items:center}
.kartu .kitem svg{height:clamp(30px,6vh,64px);width:auto}
.kartu .kpics{display:flex;gap:10px}
.kartu .kpics svg{height:clamp(70px,16vh,170px);width:auto}

/* murid chips */
.mchips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mchip{display:inline-flex;align-items:center;gap:8px;height:clamp(40px,6vh,64px);padding:0 clamp(12px,1.4vw,22px);border-radius:999px;font-weight:800;font-size:clamp(14px,2.2vh,22px);background:#fff;border:3px solid var(--line);color:var(--ink)}
.mchip i{width:14px;height:14px;border-radius:50%}
.mchip.on{color:#fff}
.mchip .ok{font-size:.9em}

/* AAC */
.aac{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,1.2vh,16px);width:min(100%,175vh)}
.sym{border-radius:var(--r);background:#fff;box-shadow:0 4px 0 var(--line);padding:clamp(6px,1vh,12px) 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:8px solid var(--c,var(--green))}
.sym .e{font-size:clamp(30px,10vh,112px);line-height:1.1}
.sym .w{font-family:var(--display);font-weight:800;font-size:clamp(13px,3vh,34px);color:var(--green-d)}
.sym:active{transform:translateY(3px)}
.strip{display:flex;align-items:center;gap:10px;width:min(100%,175vh);min-height:clamp(56px,9vh,96px);background:#fff;border-radius:999px;padding:6px 8px 6px 22px;box-shadow:inset 0 0 0 3px var(--line)}
.strip .words{flex:1;display:flex;gap:8px;flex-wrap:wrap;min-width:0;font-family:var(--display);font-weight:800;font-size:clamp(18px,4.2vh,46px);color:var(--green-d)}
.strip .words span{background:var(--gold-l);border-radius:10px;padding:2px 12px}
.strip .ph0{color:#B9AE94;font-weight:700}

/* jump */
.jump{display:flex;align-items:flex-end;gap:clamp(20px,5vw,90px)}
.kid{height:min(50vh,40vw);width:auto}
.kid.hop{animation:hop .5s ease-out}
@keyframes hop{40%{transform:translateY(-22%)}100%{transform:translateY(0)}}
.jcount{font-family:var(--display);font-weight:800;color:var(--coral);font-size:clamp(28px,6vh,64px);min-height:1.2em}

/* rotation */
.rot{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,36px);width:min(100%,160vh)}
.station{border-radius:calc(var(--r)*1.6);background:#fff;box-shadow:0 5px 0 var(--line);padding:clamp(12px,2vh,26px) clamp(14px,2vw,32px);display:flex;flex-direction:column;gap:clamp(8px,1.4vh,16px)}
.station h2{margin:0;display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;color:var(--green-d);font-size:clamp(18px,3.4vh,38px)}
.station h2 svg{width:1.3em;height:1.3em}
.station small{color:var(--muted);font-weight:700;font-size:clamp(12px,1.8vh,18px)}
.gpill{display:flex;align-items:center;gap:12px;border-radius:16px;padding:clamp(8px,1.4vh,16px) 16px;color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(18px,3.2vh,34px)}
.gpill span{font-family:var(--body);font-weight:700;font-size:.62em;opacity:.95}
.gpill svg{width:1.2em;height:1.2em}

/* closing */
.sum{max-width:min(92vw,160vh);text-align:center;font-family:var(--display);font-weight:800;color:var(--green-d);font-size:clamp(24px,6.4vh,72px);line-height:1.15;text-wrap:balance}
.home-task{display:flex;align-items:center;gap:16px;background:#fff;border-radius:calc(var(--r)*1.4);padding:clamp(10px,1.6vh,18px) clamp(14px,1.6vw,26px);box-shadow:0 4px 0 var(--line);font-size:clamp(15px,2.6vh,28px);font-weight:700;max-width:min(92vw,120vh)}
.home-task svg{width:clamp(36px,6vh,64px);height:auto;flex:none}

/* ---------- bottom bar */
.bot{display:flex;align-items:center;gap:clamp(6px,.8vw,14px);padding:clamp(6px,1vh,12px) max(16px,2vw);padding-bottom:calc(clamp(6px,1vh,12px) + env(safe-area-inset-bottom,0px));background:#fff;border-top:2px solid var(--line)}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:clamp(44px,6.6vh,70px);min-width:clamp(44px,6.6vh,70px);padding:0 clamp(8px,1vw,18px);border-radius:14px;background:var(--mint);color:var(--green-d);font-weight:800;font-size:clamp(13px,1.9vh,19px)}
.tb svg{width:clamp(20px,3vh,32px);height:clamp(20px,3vh,32px)}
.tb.on{background:var(--green);color:#fff}
.tb.nav{background:var(--green);color:#fff;padding:0 clamp(14px,1.8vw,30px)}
.tb.nav[disabled]{opacity:.35}
.count{font-family:var(--display);font-weight:800;color:var(--green-d);font-size:clamp(14px,2.2vh,22px);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:center}
.spacer{flex:1}
.tb .lbl{white-space:nowrap}
.tb.mini{flex-direction:column;gap:2px;padding:4px clamp(6px,.7vw,12px);font-size:clamp(11px,1.45vh,14px);min-width:clamp(44px,6vw,104px)}
.tb.mini svg{width:clamp(20px,2.8vh,30px);height:clamp(20px,2.8vh,30px)}
.bot{overflow:hidden}
@media (max-width:1400px){.tb.mini .lbl{display:none}}

/* overlays */
.note{position:absolute;right:max(16px,2vw);top:clamp(10px,2vh,26px);width:min(460px,42vw);max-height:calc(100% - 20px);overflow:auto;background:var(--paper);border:3px solid var(--gold);border-radius:18px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.18);z-index:20;color:var(--ink)}
.note h3{margin:0 0 6px;font-family:var(--display);font-weight:800;color:var(--green-d);font-size:clamp(15px,2.2vh,21px)}
.note p{margin:0 0 8px;font-size:clamp(14px,2vh,19px);line-height:1.45}
.note .rpm{font-weight:800;color:var(--gold-d);font-size:clamp(12px,1.7vh,16px);letter-spacing:.06em;text-transform:uppercase}
.modal{position:fixed;inset:0;background:rgba(10,30,28,.55);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--paper);border-radius:22px;width:min(1500px,100%);max-height:92vh;overflow:auto;padding:clamp(16px,2.4vh,30px) clamp(16px,2vw,34px);box-shadow:0 30px 60px rgba(0,0,0,.3)}
.mbox h2{margin:0 0 12px;font-family:var(--display);font-weight:800;color:var(--green-d);font-size:clamp(20px,3.2vh,32px)}
.mhead{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:15vh;transform:translateX(-50%) scale(.6);opacity:0;background:var(--gold);color:var(--green-d);font-family:var(--display);font-weight:800;font-size:clamp(28px,7vh,80px);padding:.15em .8em;border-radius:999px;box-shadow:0 10px 0 #C99400;z-index:60;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}
.timer{position:fixed;right:max(16px,2vw);bottom:calc(clamp(56px,9vh,96px) + 10px);z-index:40;background:#fff;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:10px 14px;display:flex;align-items:center;gap:12px}
.timer svg.ring{width:clamp(64px,10vh,110px);height:clamp(64px,10vh,110px)}
.timer .tt{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.6vh,38px);color:var(--green-d);font-variant-numeric:tabular-nums}
.timer .tbx{display:flex;flex-direction:column;gap:6px}
.timer .trow{display:flex;gap:6px}
.timer.ding{animation:ding .5s 4}
@keyframes ding{50%{box-shadow:0 0 0 8px var(--gold)}}

/* home */
.home{height:100%;overflow:auto;display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(16px,3vw,60px);padding:clamp(16px,4vh,60px) max(16px,4vw);align-items:center;background:radial-gradient(circle at 92% 6%,rgba(244,180,0,.28) 0,rgba(244,180,0,0) 32%),var(--cream)}
.home .eyebrow{font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);font-size:clamp(12px,1.8vh,18px)}
.home h1{margin:.2em 0 .15em;font-family:var(--display);font-weight:800;color:var(--green-d);font-size:clamp(38px,9vh,104px);line-height:1;letter-spacing:-.02em;text-wrap:balance}
.home h1 em{font-style:normal;color:var(--star)}
.home p.sub{margin:0 0 clamp(14px,3vh,34px);font-size:clamp(16px,2.6vh,26px);color:var(--muted);max-width:34em}
.cards{display:grid;gap:clamp(10px,1.6vh,18px)}
.hcard{display:flex;align-items:center;gap:clamp(12px,1.4vw,22px);text-align:left;border-radius:22px;padding:clamp(12px,2vh,22px) clamp(14px,1.6vw,26px);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.hcard .hi{flex:none;width:clamp(48px,8vh,84px);height:clamp(48px,8vh,84px);border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.hcard .hi svg{width:62%;height:62%}
.hcard b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(18px,3.2vh,34px);line-height:1.1}
.hcard span{display:block;font-size:clamp(13px,2vh,19px);opacity:.9}
.hcard .go{margin-left:auto;font-family:var(--display);font-weight:800;font-size:clamp(14px,2.2vh,22px);white-space:nowrap}
.hlinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(12px,2vh,22px)}
.hero-art{position:relative;display:grid;place-items:center}
.hero-art .screen{width:100%;max-width:640px;aspect-ratio:16/10;border-radius:26px;background:#13232B;padding:3.2%;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.hero-art .scr{width:100%;height:100%;border-radius:14px;background:var(--paper);display:flex;align-items:flex-end;justify-content:center;gap:4%;padding:6% 6% 9%;position:relative;overflow:hidden}
.hero-art .scr svg{height:62%;width:auto}
.hero-art .five{position:absolute;right:6%;top:8%;width:22%;aspect-ratio:1;border-radius:18px;background:var(--green);color:var(--gold);font-family:var(--display);font-weight:800;font-size:clamp(40px,9vh,110px);display:grid;place-items:center}
.hero-art .ck{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.hint{margin-top:clamp(10px,2vh,20px);font-size:clamp(13px,1.8vh,17px);color:var(--muted)}

/* assessment */
.atabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tblwrap{overflow-x:auto;border-radius:14px;border:2px solid var(--line);background:#fff}
table.as{border-collapse:collapse;width:100%;font-size:clamp(14px,2vh,20px)}
table.as th,table.as td{padding:8px 10px;border-bottom:1px solid #EFE7D2;text-align:left;vertical-align:middle}
table.as th{background:var(--green);color:#fff;font-weight:800;position:sticky;top:0}
table.as td.c,table.as th.c{text-align:center}
table.as select{font:inherit;font-weight:700;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);min-width:5.2em}
table.as tr:nth-child(even) td{background:var(--mint)}
.kat{display:inline-block;min-width:2.2em;text-align:center;border-radius:8px;padding:2px 8px;color:#fff;font-weight:800}
.kat.A{background:var(--green)} .kat.B{background:var(--indigo)} .kat.C{background:var(--star)} .kat.D{background:var(--coral)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 2px 0;color:var(--muted);font-size:clamp(12px,1.7vh,16px)}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rcard{border-radius:16px;background:#fff;border:2px solid var(--line);overflow:hidden}
.rcard .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(16px,2.4vh,22px)}
.rcard .rb{padding:10px 14px;font-size:clamp(13px,1.8vh,16px);line-height:1.45}
.rcard .rb p{margin:0 0 6px}
.rcard .draft{background:var(--mint);border-radius:10px;padding:8px 10px;margin-top:6px}
textarea.copy{width:100%;min-height:140px;margin-top:10px;font:inherit;font-size:14px;border-radius:12px;border:2px solid var(--line);padding:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;color:var(--green-d)}
.form input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}
.small{color:var(--muted);font-size:clamp(12px,1.7vh,16px)}
.rub{display:grid;gap:8px;width:min(100%,780px)}
.rub .ra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 var(--line)}
.rub .ra b{font-size:clamp(13px,2.2vh,22px)}
.lv{display:flex;gap:6px}
.lv button{min-width:clamp(40px,6.4vh,70px);height:clamp(36px,6vh,64px);border-radius:10px;background:var(--mint);font-weight:800;font-size:clamp(12px,2vh,20px);color:var(--green-d)}
.lv button.on.l4{background:var(--green);color:#fff} .lv button.on.l3{background:var(--indigo);color:#fff} .lv button.on.l2{background:var(--star);color:#fff} .lv button.on.l1{background:var(--coral);color:#fff} .lv button.on.l0{background:var(--muted);color:#fff}

@media (max-width:820px){
  html,body{overflow:auto;height:auto}
  #app{height:auto;min-height:100%}
  .stage{min-height:78vh}
  .phases .ph i{display:none}
  .home{grid-template-columns:1fr}
  .tools{max-width:100%}
  .head{flex-wrap:wrap}
  .rot{grid-template-columns:1fr}
  .aac{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tb .lbl{display:none}
  .code{display:none}
  .tools{width:100%;max-width:100%;justify-content:flex-start}
  .htext h1{font-size:clamp(22px,7vw,40px)}
  .bot{flex-wrap:wrap}
  .sched{flex-wrap:wrap}.scard{flex:1 1 40%}
  .tpad .tname{display:none}
  .tracewrap{flex-wrap:wrap}.tpad{width:min(44vw,100%)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
/* =========================================================

let actx=null,idVoice=null,voicesChecked=false;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
function tone(f,d=.18,type='sine',g=.14,when=0){if(!D.snd.on)return;const c=ac();if(!c)return;const t=c.currentTime+when;const o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g*D.snd.vol,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.05);}
const chime=()=>{tone(784,.16,'sine',.12);tone(1175,.28,'sine',.1,.1);};
const soft=()=>tone(392,.22,'triangle',.09);
const jingle=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.11,i*.11));
function brum(){if(!D.snd.on)return;const c=ac();if(!c)return;const t=c.currentTime;const o=c.createOscillator(),v=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(60,t);o.frequency.linearRampToValueAtTime(130,t+1.2);v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(.06*D.snd.vol,t+.1);v.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(v).connect(c.destination);o.start(t);o.stop(t+1.7);}
function loadVoices(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();if(v.length){voicesChecked=true;idVoice=v.find(x=>/^id([-_]|$)/i.test(x.lang))||v.find(x=>/indones/i.test(x.name))||null;}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function say(t){if(!D.snd.on||!t)return;if(!('speechSynthesis' in window))return;loadVoices();if(voicesChecked&&!idVoice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';if(idVoice)u.voice=idVoice;u.rate=D.snd.rate;u.volume=D.snd.vol;speechSynthesis.speak(u);}catch(e){}}
function voiceStatus(){if(!('speechSynthesis' in window))return 'Peramban ini tidak mendukung suara. Kata tetap tampil di layar dan bunyi nada tetap berjalan.';loadVoices();if(!voicesChecked)return 'Suara sedang dimuat. Tekan tombol pengeras suara untuk mencoba.';return idVoice?`Suara bahasa Indonesia tersedia (${idVoice.name}).`:'Suara bahasa Indonesia belum terpasang. Pasang lewat Pengaturan perangkat → Bahasa dan input → Keluaran teks-ke-ucapan. Sementara itu hanya bunyi nada.';}

const fx=document.getElementById('fx');const fxc=fx.getContext('2d');let parts=[],fxOn=false;
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){if(RM)return;fx.width=innerWidth;fx.height=innerHeight;const cols=['#F4B400','#0F5C4F','#D9622B','#3E5BA9','#2E9B57','#F6C33B'];for(let i=0;i<140;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.75,vx:(Math.random()-.5)*16,vy:-Math.random()*18-8,r:Math.random()*8+5,c:pick(cols),a:Math.random()*6,l:90+Math.random()*40});if(!fxOn){fxOn=true;requestAnimationFrame(stepFx);}}
function stepFx(){fxc.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.55;p.vx*=.99;p.a+=.2;p.l--;fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.a);fxc.fillStyle=p.c;fxc.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);fxc.restore();});parts=parts.filter(p=>p.l>0&&p.y<fx.height+40);if(parts.length)requestAnimationFrame(stepFx);else{fxOn=false;fxc.clearRect(0,0,fx.width,fx.height);}}
let toastT;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1500);}

function countSet(n,{kind='jagung',perRow=5,size,onStep,onDone,numbers=true,interactive=true}={}){
  const wrap=h('div',{class:'cset'});if(size)wrap.style.setProperty('--ih',size);
  const rows=[];for(let r=0;r<Math.ceil(n/perRow);r++){const row=h('div',{class:'crow'});rows.push(row);wrap.append(row);}
  const items=[];const order=[];
  for(let i=0;i<n;i++){const b=h('button',{type:'button',class:'item '+(kind==='ikan'?'fish':'corn')+(interactive?'':' static'),'aria-label':`${kind} ke-${i+1}`,html:use(kind==='ikan'?'fish':'corn')+'<span class="badge"></span>'});if(interactive)b.addEventListener('click',()=>tap(i));rows[Math.floor(i/perRow)].append(b);items.push(b);}
  function tap(i){if(order.includes(i)){items[i].classList.remove('wiggle');void items[i].offsetWidth;items[i].classList.add('wiggle');return;}order.push(i);const k=order.length;items[i].classList.add('on');if(numbers)items[i].querySelector('.badge').textContent=k;tone(520+k*40,.12,'triangle',.08);say(KATA[k]);onStep&&onStep(k);if(k===n&&onDone)setTimeout(()=>onDone(n),700);}

    undo(){const i=order.pop();if(i==null)return;items[i].classList.remove('on');items[i].querySelector('.badge').textContent='';onStep&&onStep(order.length);},
    reset(){while(order.length)this.undo();},

  const bt=h('div',{class:'tbtns'},clear,good);pad.append(g,cv,nm,bt);const ctx=cv.getContext('2d');let dpr=1;
  function fit(){const r=cv.getBoundingClientRect();if(!r.width)return;dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#D9622B';ctx.lineWidth=Math.max(10,r.width*.05)*dpr;}

  cv.addEventListener('pointermove',e=>{const l=last[e.pointerId];if(!l)return;const r=cv.getBoundingClientRect();const p=[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr];ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last[e.pointerId]=p;});

  clear.addEventListener('click',()=>{ctx.clearRect(0,0,cv.width,cv.height);});good.addEventListener('click',()=>celebrate(`Bagus! Angka ${KATA[n]}.`));
